[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-renderer"
version = "0.1.0"
description = "Self-contained offline OpenXML (.docx) to PNG layout and rendering engine for LLM visual feedback"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
